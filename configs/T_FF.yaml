prefetch_factor: 2
wandb_project: T_FF
save_path: ./results/T_FF/TFF_saved_model.pth
kitti_root: ./data/KITTI
split_json: ./data/KITTI/kitti_split_8_2.json
resume: true
anchors:
  P3:
    - [7.22, 30.52]
    - [8.61, 41.93]
    - [7.91, 54.59]
  P4:
    - [9.52, 70.16]
    - [12.75, 54.51]
    - [9.44, 90.87]
  P5:
    - [12.78, 80.82]
    - [16.67, 86.19]
    - [13.83, 111.16]
